
name: postgresql

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    secrets:
      - postgres_password

    volumes:
      - /srv/postgresql/data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    ports:
      - "127.0.0.1:5432:5432" # For DBeaver SSH tunnel
      - "172.17.0.1:5432:5432" # For access from Kubernetes

secrets:
  postgres_password:
    file: /etc/postgresql/superuser-password
