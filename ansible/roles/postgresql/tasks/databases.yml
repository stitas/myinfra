- name: Install PostgreSQL Python driver
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present

- name: Create database users
  community.postgresql.postgresql_user:
    name: "{{ item.user }}"
    password: "{{ postgresql_passwords[item.user] }}"
    login_host: 127.0.0.1
    login_user: postgres
    login_password: "{{ postgresql_superuser_password }}"
    login_db: postgres
    state: present
  loop: "{{ postgresql_databases }}"
  no_log: true

- name: Create application databases
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.user }}"
    login_host: 127.0.0.1
    login_user: postgres
    login_password: "{{ postgresql_superuser_password }}"
    state: present
  loop: "{{ postgresql_databases }}"
  no_log: true
