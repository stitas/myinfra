- name: Require PostgreSQL passwords from Vault
  ansible.builtin.assert:
    that:
      - postgresql_superuser_password | default('') | length > 0
      - postgresql_passwords is defined
  no_log: true

- name: Require a Vault password for each application user
  ansible.builtin.assert:
    that: postgresql_passwords[item.user] | default('') | length > 0
  loop: "{{ postgresql_databases }}"
  no_log: true

- name: Create PostgreSQL directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /opt/postgresql
      mode: "0755"
    - path: /srv/postgresql
      mode: "0755"

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: /srv/postgresql/data
    state: directory

- name: Install PostgreSQL Compose configuration
  ansible.builtin.copy:
    src: compose.yaml
    dest: /opt/postgresql/compose.yaml
    owner: root
    group: root
    mode: "0644"

- name: Start PostgreSQL
  ansible.builtin.command:
    cmd: docker compose -f compose.yaml -f - up -d --wait --wait-timeout 120
    chdir: /opt/postgresql
    # Compose merges stdin; escape $ so password text is not treated as interpolation.
    stdin: >-
      {{ {'services': {'postgres': {'environment':
        {'POSTGRES_PASSWORD': postgresql_superuser_password | replace('$', '$$')}
      }}} | to_json }}
  register: postgres_compose
  changed_when: >
    'Created' in postgres_compose.stderr or
    'Recreated' in postgres_compose.stderr or
    'Started' in postgres_compose.stderr
  no_log: true

- name: Provision application databases
  ansible.builtin.import_tasks: databases.yml
  when: not infra_recovery_mode | default(false) | bool
