---
# Primary local encrypted restic repository (on the SAME VPS).
backup_local_repository: /srv/backups/restic

backup_b2_enabled: true
backup_b2_repository: "s3:https://s3.eu-central-003.backblazeb2.com/meka-backups"

backup_media_enabled: false
backup_media_path: /srv/copyparty/files

# Daily at 03:00 VPS local time (add a small random delay).
backup_schedule: "*-*-* 03:00:00"
backup_randomized_delay: 5m

backup_keep_daily: 5
backup_keep_weekly: 2
backup_keep_monthly: 1
