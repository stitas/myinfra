---
- name: Download K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/install-k3s.sh
    mode: "0700"

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure K3s DNS resolvers
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/resolv.conf
    content: |
      {% for nameserver in k3s_dns_servers %}
      nameserver {{ nameserver }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Configure K3s resolver file
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      resolv-conf: /etc/rancher/k3s/resolv.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Install K3s server
  ansible.builtin.command:
    cmd: /usr/local/src/install-k3s.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_EXEC: server

- name: Enable and start K3s
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
  
- name: Configure PostgreSQL endpoint
  ansible.builtin.copy:
    src: postgresql-endpoint.yaml
    dest: /var/lib/rancher/k3s/server/manifests/postgresql-endpoint.yaml
    owner: root
    group: root
    mode: "0644"