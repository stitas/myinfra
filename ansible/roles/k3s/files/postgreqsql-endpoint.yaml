apiVersion: v1
kind: Namespace
metadata:
  name: database

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgresql
  namespace: database
  labels:
    kubernetes.io/service-name: postgresql
    endpointslice.kubernetes.io/managed-by: ansible

addressType: IPv4

ports:
  - name: postgres
    protocol: TCP
    port: 5432

endpoints:
  - addresses:
      - "172.17.0.1"