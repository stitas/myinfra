apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: copyparty
  namespace: argocd

spec:
  project: applications

  source:
    repoURL: https://github.com/stitas/myinfra.git
    targetRevision: master
    path: kubernetes/resources/copyparty

  destination:
    server: https://kubernetes.default.svc
    namespace: app-copyparty

  syncPolicy:
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true