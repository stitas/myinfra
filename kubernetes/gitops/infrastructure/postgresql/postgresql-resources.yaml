apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-resources
  namespace: argocd
spec:
  project: infrastructure

  source:
    repoURL: https://github.com/stitas/myinfra.git
    targetRevision: master
    path: kubernetes/resources/postgresql

  destination:
    server: https://kubernetes.default.svc
    namespace: database

  syncPolicy:
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true