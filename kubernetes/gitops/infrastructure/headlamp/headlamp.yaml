apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd

spec:
  project: infrastructure

  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.46.0
    helm:
      valuesObject:
        config:
          inCluster: true
          unsafeUseServiceAccountToken: true # Safe, because protected with auth proxy
          extraArgs:
            - "-proxy-auth=true"

        clusterRoleBinding:
          create: false

        service:
          type: ClusterIP

        ingress:
          enabled: false

        serviceAccount:
          create: true
          name: headlamp
        
        clusterRoleBinding:
          create: false

  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true