{{- with .Values.sealedImagePullSecret }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ required "Set sealedImagePullSecret.name" .name | quote }}
  namespace: {{ $.Release.Namespace }}
spec:
  encryptedData:
    .dockerconfigjson: {{ required "Set sealedImagePullSecret.dockerConfig to sealed ciphertext" .dockerConfig | quote }}
  template:
    type: kubernetes.io/dockerconfigjson
{{- end }}