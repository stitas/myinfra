image: ""
containerPort: null

replicaCount: 1
revisionHistoryLimit: 3

# Non-secret environment variables.
config: {}

# Ciphertext sealed in the app namespace.
sealedSecrets: {}
sealedImagePullSecret: {}

resources: {}
securityContext: {}
volumes: []
volumeMounts: []
podAnnotations: {}

# Set a hostname to create an HTTPS Ingress.
ingress:
  host: ""
  # List of {path, pathType} entries. Empty or omitted uses / with Prefix matching.
  paths: []

readinessProbe:
  readinessPath: ""
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 0
  failureThreshold: 5
  successThreshold: 1