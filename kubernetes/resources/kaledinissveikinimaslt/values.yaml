image: ghcr.io/stitas/kaledinissveikinimaslt-app:a9e283579bf38255b5981ea862a37238ef5dfe4e

containerPort: 8080

ingress:
  hosts:
    - kaledinissveikinimas.lt
    - www.kaledinissveikinimas.lt
  paths:
    - path: /api/v1/payment/hook
      pathType: Exact
    - path: /api/v1/video/hook
      pathType: Exact

config:
  SPRING_PROFILES_ACTIVE: prod
  STRIPE_SUCCESS_URL: https://kaledinissveikinimas.lt/mokejimas-sekmingas
  STRIPE_CANCEL_URL: https://kaledinissveikinimas.lt/mokejimas-atsauktas
  EMAIL_FROM: info@kaledinissveikinimas.lt
  EMAIL_FROM_NAME: KaledinisSveikinimas.lt
  EMAIL_TO: fakemaskw@gmail.com
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql.database.svc.cluster.local:5432/dovkal
  SPRING_DATASOURCE_USERNAME: dovkal

# name: ghcr-pull-app
# namespace: app-kaledinissveikinimaslt
sealedImagePullSecret:
  name: ghcr-pull-app
  dockerConfig: 

# name: kaledinissveikinimaslt-secrets 
# namespace: app-kaledinissveikinimaslt
sealedSecrets:
  BREVO_SMTP_LOGIN: 
  BREVO_SMTP_PASSWORD: 
  HEYGEN_API_KEY: 
  HEYGEN_WEBHOOK_SECRET: 
  SPRING_DATASOURCE_PASSWORD: 
  STRIPE_GREETING_1_PRICE_ID: 
  STRIPE_GREETING_2_PRICE_ID: 
  STRIPE_GREETING_3_PRICE_ID: 
  STRIPE_GREETING_4_PRICE_ID:   
  STRIPE_SECRET: 
  STRIPE_WEBHOOK_SECRET: 

podAnnotations:
  infra.stitas.dev/config-revision: "1"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1024Mi

readinessProbe:
  path: /actuator/health/readiness
