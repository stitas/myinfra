apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umami
  namespace: app-umami
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

spec:
  ingressClassName: traefik

  rules:
    - host: stats.stitas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: umami
                port:
                  number: 80

  tls:
    - hosts:
        - stats.stitas.dev
      secretName: umami-tls