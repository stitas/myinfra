apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: app-umami
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: umami

  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:3.4.1

          ports:
            - containerPort: 3000

          envFrom:
            - secretRef:
                name: umami-secrets

          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: 3000
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 3000
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi