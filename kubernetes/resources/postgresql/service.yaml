apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgresql
  namespace: database
  labels:
    kubernetes.io/service-name: postgresql
    endpointslice.kubernetes.io/managed-by: gitops
addressType: IPv4
ports:
  - name: postgres
    protocol: TCP
    port: 5432
endpoints:
  - addresses:
      - "172.17.0.1"