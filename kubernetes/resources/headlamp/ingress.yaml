apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-headlamp-strip-identity@kubernetescrd,headlamp-headlamp-auth@kubernetescrd

spec:
  ingressClassName: traefik

  rules:
    - host: k3s.stitas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80

  tls:
    - hosts:
        - k3s.stitas.dev
      secretName: headlamp-tls