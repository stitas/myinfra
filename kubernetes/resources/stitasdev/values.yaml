image: ghcr.io/stitas/stitasdev:fae88edda776d4a79354fc40f5dbf2302712cd16

ingress:
  host: stitas.dev

config:
  ORIGIN: https://stitas.dev
  BLOG_CONTENT_DIR: /blogs
  KIT_FORM_ID: 9593327
  PUBLIC_UMAMI_SCRIPT_SRC: "https://umami.stitas.dev/script.js"
  PUBLIC_UMAMI_WEBSITE_ID: "35d8dcef-c535-4bfa-892d-63b859168046"

# name: ghcr-pull 
# namespace: app-stitasdev
sealedImagePullSecret:
  name: ghcr-pull
  dockerConfig: 

# name: stitasdev-secrets 
# namespace: app-stitasdev
sealedSecrets:
  KIT_API_KEY: 

podAnnotations:
  infra.stitas.dev/config-revision: "1"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

securityContext:
  # Use Copyparty's UID and GID to read the blog directory.
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

volumes:
  - name: blogs
    hostPath:
      path: /srv/copyparty/public/stitasdev/blogs
      type: Directory

volumeMounts:
  - name: blogs
    mountPath: /blogs
    readOnly: true