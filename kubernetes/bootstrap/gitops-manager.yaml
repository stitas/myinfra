apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-manager
  namespace: argocd

spec:
  project: infrastructure

  source:
    repoURL: https://github.com/stitas/myinfra.git
    targetRevision: master
    path: kubernetes/gitops
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true