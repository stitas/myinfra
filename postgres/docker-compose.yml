services:
  postgres:
    image: postgres:17-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      app_internal:
        aliases:
          - postgres
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:

networks:
  app_internal:
    external: true