services:
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami_user:${UMAMI_DB_PASSWORD}@postgres:5432/umami_db
      APP_SECRET: ${UMAMI_APP_SECRET}
    networks:
      - app_internal
    ports:
      - "127.0.0.1:3001:3000"

networks:
  app_internal:
    external: true